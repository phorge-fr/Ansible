name: Validate

# Gate between the working branches and main. Needs no secrets: vault_pass is
# gitignored, and neither ansible-lint nor --syntax-check has to decrypt
# anything to do its job (verified on every playbook, including the
# vault-heavy compute ones).
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 from
    # 2026-10-19, and a validation gate should not change under the repository
    # on a date nobody chose. Bumped deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned so a new ansible-lint release cannot turn a green pull request
      # red on its own. Bumped deliberately, like requirements.yml - Renovate
      # keeps the action versions above current.
      - name: Install ansible-core and ansible-lint
        run: pip install 'ansible-core==2.21.*' 'ansible-lint==26.9.*'

      # collections/ and the vendored roles are gitignored, so a fresh checkout
      # has neither, and ansible-lint cannot resolve lxc.incus.* or
      # grafana.grafana.* without them.
      - name: Install the pinned collections and roles
        run: ansible-galaxy install -r requirements.yml

      # Reads .ansible-lint for the exclusions. ansible-lint runs yamllint
      # itself, so there is no separate YAML step.
      - name: ansible-lint
        run: ansible-lint

      - name: Syntax-check every playbook
        run: |
          for playbook in playbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook "$playbook" --syntax-check
            echo "::endgroup::"
          done
