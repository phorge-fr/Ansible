# Ceph mgr options applied by configure-compute.yml (ceph config set mgr <key> <value>).
# exclude_perf_counters is true by default because Ceph expects a ceph-exporter daemon
# to provide the per-daemon perf counters; none is packaged/deployed here, so without
# this the OSD/mon latency and op counters would be missing from the metrics.
ceph_mgr_config:
  mgr/prometheus/exclude_perf_counters: "false"

# Ceph mgr modules to turn off. restful is enabled by default in Ceph (mgr_initial_modules), is a deprecated REST API
# nobody uses here, and does `from OpenSSL import crypto` at module level - a PyO3 import that cannot work in a mgr
# sub-interpreter on Debian 13, which the bcrypt stand-in cannot fix (it needs the real library). Left enabled it
# keeps MGR_MODULE_DEPENDENCY in HEALTH_WARN forever.
ceph_mgr_modules_disabled:
  - restful
