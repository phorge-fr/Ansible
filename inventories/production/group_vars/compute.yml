---
firewall_mode: audit

# Real ports, read live off the 3 nodes with `ss -ltnH`/`ss -lunH` (2026-09-25) and cross-checked against what each
# service actually needs to reach across nodes - not a placeholder. comp-ns carries no host service (it has no IP of
# its own, see incus_uplink_interface below: it's the bare L2 parent of Incus's physical UPLINK network, terminated
# by OVN/OVS, never by this host's own nftables input chain), so nothing here sources from it. This replaces the
# previous blanket firewall_trusted_sources for the whole 10.10.0.0/24 - that made every counter in audit mode
# meaningless (trusted traffic never reaches the "would this be blocked" accounting at all), so it was hiding
# exactly the information this list needs to stay accurate.
firewall_allowed_ports:
  - proto: tcp
    ports: [179]
    sources:
      - 10.10.0.254  # the router: iBGP peer (Network repo's bgp_connections) AND HAProxy's incus-cluster backend,
                      # masqueraded to the router's own comp-ew address (Network's srcnat rule for the containers subnet)
    comment: BGP from the router
  - proto: tcp
    ports: [3300, 6789]
    sources:
      - &nodes 10.10.0.1-10.10.0.3
    comment: Ceph mon (msgr2/msgr1)
  - proto: tcp
    ports: ["6800-7300"]  # canonical Ceph OSD range - live usage today is only 6800-6809 (one OSD per node)
    sources:
      - *nodes
    comment: Ceph OSD
  - proto: tcp
    ports: [6641, 6642, 6643, 6644]
    sources:
      - *nodes
    comment: OVN northbound/southbound DB (6641/6642 client, 6643/6644 raft cluster between the 3 central nodes)
  - proto: udp
    ports: [6081]
    sources:
      - *nodes
    comment: OVN geneve tunnel between chassis
  - proto: tcp
    ports: [8443]
    sources:
      - *nodes
      - 10.10.0.254  # HAProxy's incus-cluster backend, see the BGP rule above for why it's the router's address
    comment: Incus cluster/API (cluster peers, and HAProxy for iaas.phorge.fr)
  # core.metrics_address (8444) needs no rule: each node only ever scrapes its OWN address (alloy_extra_env below),
  # which the kernel delivers over lo regardless of the interface the IP is configured on - already covered by the
  # firewall role's unconditional "loopback" allow. Ceph's own Prometheus endpoint (9283) is scraped the same way,
  # over a literal 127.0.0.1 in alloy-compute.alloy.

# Which pending packages playbooks/upgrade-compute.yml treats as cluster
# components. Split by rolling semantics, not by vendor: storage and network
# tolerate mixed versions across members and are rolled one node at a time,
# while Incus blocks the cluster until every member agrees on the version and
# has to be swept across all of them at once.
upgrade_compute_regex_storage: '^(ceph|lib(ceph|rados|rbd)|python3-(ceph|rados|rbd))'
upgrade_compute_regex_network: '^(ovn|openvswitch|libopenvswitch)'
upgrade_compute_regex_incus: '^incus'

# playbooks/setup-network-mtu.yml. comp-ew carries the OVN Geneve tunnels
# (ovn_ip_address is this interface), and Geneve costs 58 bytes: at the default
# 1500 the overlay is capped at 1442, which is what broke PMTUD for instances.
# 8152 matches the RouterOS VLAN and was measured end to end through the switch.
# comp-ns is deliberately absent - it only ever carries decapsulated traffic.
network_mtu:
  enp0s31f6: 8152
network_mtu_gateway: 10.10.0.254

# The MTU instances get. 1500 rather than the 8094 the underlay would now allow:
# a guest at 1500 needs no PMTUD towards the internet, which is the whole point.
incus_ovn_instance_mtu: 1500

# patch.yml flags these instead of upgrading them in place. Its shape - one
# node at a time, with a prompt between nodes - is the worst possible one for
# Incus, which blocks the cluster for as long as the members disagree on the
# version. playbooks/upgrade-compute.yml sweeps them correctly.
patch_handover_regex: '^(ceph|lib(ceph|rados|rbd)|python3-(ceph|rados|rbd)|ovn|openvswitch|libopenvswitch|incus)'
patch_handover_playbook: playbooks/upgrade-compute.yml

# Incus (see docs/incus-installation.md for the deployment procedure)
incus_name: compute
incus_release: stable  # Zabbly repo: needed for incus-ui-canonical, missing from Debian's own repo
incus_roles:
  - cluster
  - ui
# comp-opti-01.phorge sorts first alphabetically among this group's cluster
# members, so lxc.incus treats it as the bootstrap node automatically.

ceph_fsid: 0e979264-9cec-4f55-8003-469b3c03ef7f  # generated once with uuidgen, not a secret, must stay stable across runs
ceph_release: distro  # Debian 13's own ceph-common, avoids a third external apt repo
ceph_roles:
  - client
  - mon
  - mgr
  - osd
ceph_network_public: "10.10.0.0/24"  # comp-ew; no separate Ceph replication NIC, so public and private share it

ovn_name: compute
ovn_roles:
  - central
  - host

# lxc.incus.ceph and lxc.incus.ovn generate cluster-wide keys/certs once (on the
# first host reached) and cache them here to hand out to the other nodes across
# separate/staged runs. Kept inside the repo, gitignored - never commit it.
config_root_dir: "{{ playbook_dir }}/../.generated"

# Cluster-wide incus config set keys, applied once at bootstrap (see the
# idempotency note in docs/incus-installation.md - this dict is NOT reapplied
# on later runs once incus is already installed).
#
# OpenFGA (authorization.openfga.*) is deliberately NOT in here: its three
# keys must be set together in ONE `incus config set`, and the store id only
# exists once the store has been created - both are handled by
# configure-compute.yml (see incus_openfga_* below), not by this dict. Loading
# OpenFGA is not enough on Incus 7.4 though: each client class is routed to a
# driver by authorization.client.* (below), and the built-in route for OIDC is
# "allow" - without it every Authentik user is a full admin, OpenFGA or not.
incus_init_shared_config:
  cluster.healing_threshold: "4"
  cluster.offline_threshold: "11"
  core.bgp_asn: "65535"
  core.metrics_authentication: "false"
  # Real Cloudflare token (scoped: Zone.DNS Edit on phorge.fr only, not the
  # Global API Key) - modern lego Cloudflare provider needs just this one
  # env var, no CLOUDFLARE_EMAIL/CLOUDFLARE_API_KEY pair. Order matters here:
  # acme.email must stay LAST - Incus performs the real Let's Encrypt
  # registration/DNS-01 challenge as soon as it's set, so every other acme.*
  # key needs to already be in place first (this dict's insertion order is
  # what setup-compute.yml/day-2 apply iterate in).
  acme.agree_tos: "true"
  acme.challenge: "DNS-01"
  acme.domain: "iaas.phorge.fr"
  acme.provider: cloudflare
  acme.provider.environment: "CLOUDFLARE_DNS_API_TOKEN={{ incus_cloudflare_api_token }}"
  acme.email: contact@phorge.fr
  oidc.claim: email
  # Public OIDC client (PKCE, no secret, no oidc.audience) registered by
  # FrontPlane's blueprint-incus.yml in Authentik. Web UI callback:
  # https://iaas.phorge.fr/oidc/callback - CLI login uses the device flow
  # (incus remote add ... prints https://auth.phorge.fr/device + a code).
  oidc.client.id: 446e0b05-3aa6-4cfd-8ebc-084e0d7b1eef
  # auth.phorge.fr confirmed real (FrontPlane's overlays/core/apps/authentik/authentik.yml,
  # ingressClassName traefik-public). The bare domain is NOT the right issuer though:
  # Authentik's OIDC discovery is per-application, at https://<host>/application/o/<slug>/
  # (see kube-prometheus-stack.yml's Grafana auth_url/token_url for the same host using the
  # equivalent per-provider endpoints). Assumes the future blueprint-incus.yml uses slug
  # "incus" - keep them in sync when that blueprint is created.
  oidc.issuer: "https://auth.phorge.fr/application/o/incus/"
  oidc.scopes: "openid, offline_access, email"
  # Send OIDC users through OpenFGA (internal/server/auth/router.go, defaultRoutes(): unset means "allow"). Until the
  # OpenFGA driver is loaded, a route to it resolves to "deny", so a fresh bootstrap fails closed. Unrestricted TLS
  # certificates and the unix socket keep their "allow" default (Ansible, admin scripts).
  authorization.client.oidc: openfga
  logging.loki-frontplane.target.type: loki
  logging.loki-frontplane.target.address: "https://loki.core.phorge"  # confirmed real (FrontPlane's loki Ingress host)
  # Same identity as Alloy's own push (alloy_basic_auth_username/alloy_loki_basic_auth_password below): "iaas" used
  # to be a separate user for this logger alone, but Hangar#81 removed it as a believed-redundant duplicate of
  # "compute" on 2026-09-26, which silently broke this push (401, never logged - see Hangar#115). They were never
  # actually the same thing; reusing "compute" here instead of restoring "iaas" keeps that fix's single-identity
  # intent while no longer pointing at a deleted user.
  logging.loki-frontplane.target.username: "{{ alloy_basic_auth_username }}"
  logging.loki-frontplane.target.password: "{{ alloy_loki_basic_auth_password }}"
  logging.loki-frontplane.target.ca_cert: "{{ lookup('ansible.builtin.file', 'alloy-ca.crt') }}"
  # Not "logging": the daemon logs already reach Loki from the journal (Alloy), sending
  # them a second time from Incus itself would duplicate them. Each member sends only
  # its own events (verified in Loki: instance == location on every stream).
  logging.loki-frontplane.types: "lifecycle,network-acl"
  # The key the Incus UI actually prefers (checked first in the UI's own JS,
  # see #16); user.grafana_base_url remains supported as a fallback.
  user.ui.grafana.base_url: "https://monitoring.phorge.fr/d/incus/incus"
  user.ui.title: "Phorge Cloud IaaS"

# Real Cloudflare API token, scoped (Zone.DNS Edit, phorge.fr only).
incus_cloudflare_api_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          35336232613331633161346534333637373165363963396139346436663734386365646263363230
          6437636533333065613161616531653262396530353833370a363337376162373130333939373864
          33313133383762633834626462393464373362636334353831323138626166303833393135396438
          3166303865376233300a336538336234336336643266663134656537346132393439613834366430
          66633239326438306161383835333834323765646561393465646264353239346164366337306534
          34623131616165613631633562303335666364383063363263653938626664626138373730356237
          383733613034643039323561393366313230
#
# OpenFGA authorization for Incus, applied by configure-compute.yml:
# - the key names on Incus 7.4 are authorization.openfga.api.url / .api.token
#   / .store.id (the old openfga.* names from the manual doc are "unknown
#   key"; note `incus config get` returns empty for ANY key, real or not -
#   only `set` tells you whether a key exists)
# - openfga.core.phorge is only reachable from the nodes thanks to the Network
#   repo's incus-comp-to-core rule, and trusted thanks to
#   playbooks/tasks/trust-core-ca.yml (Incus's OpenFGA client has no CA option)
# - its Ingress no longer has Traefik BasicAuth (FrontPlane, removed 2026-09-23:
#   Basic and Bearer share the Authorization header, so a client can't send both)
# - a dedicated store is created if none has that name (FrontPlane also has an
#   unrelated "test-store", left alone)
incus_openfga_url: https://openfga.core.phorge
incus_openfga_store_name: Incus
# Users granted `admin` on server:incus. Without at least one, nobody but a
# TLS client certificate / the local root socket can do anything once the
# authorizer is on. Entries are the OIDC claim value (oidc.claim: email).
incus_openfga_admins:
  - contact@phorge.fr
#
# incus_openfga_api_token: the real preshared token from FrontPlane's
# overlays/core/apps/openfga/secrets.yml (`keys` field) - this is a single
# shared secret valid for OpenFGA's whole API, not scoped per client.
incus_openfga_api_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          66613732303264666361306334393735336539663636663433653966363538353338653732383435
          3835353566636439613464626533326662636161636461390a393233396265666366303835626636
          65643534303563653164663565616639316136613464376430633666336564303232363830396436
          6461643731643663620a353563363831353133343933326631373238333431306263393639613235
          33386535326664326238633738336634333363313037313933643735326637636232366532346430
          6464346631623864396562316432353664613331313863363937
incus_init_node_config: {}  # default; each host_vars overrides with its own bgp/metrics address keys

incus_init:
  config: "{{ incus_init_shared_config | combine(incus_init_node_config) }}"
  network:
    UPLINK:
      type: physical
      local_config:
        parent: "{{ incus_uplink_interface }}"  # per-host, see host_vars - comp-ns
      # Address plan (Network repo, docs/architecture.md):
      # - 10.10.0.0/24 comp-ew: east-west (cluster, API, Ceph, OVN, BGP sessions), router 10.10.0.254
      # - 10.11.0.0/24 comp-ns (VLAN 80): north-south, router 10.11.0.254. Each OVN network takes ONE address of
      #   ipv4.ovn.ranges for its virtual router's external port. Gateway and ranges must be changed in ONE
      #   `incus network set` (each is validated against the other): the OVN networks on the uplink then drop their
      #   now-invalid router address, detach and get a new one (configure-compute.yml does it that way).
      # - 10.12.0.0/24 network forwards and load balancers. NOT a VLAN, no gateway and no address on the router:
      #   OVN only accepts a forward or load balancer listen address inside the uplink's ipv4.routes, Incus announces
      #   each one over BGP as a /32 with the OVN router's comp-ns address as next hop, and the MikroTik learns it
      #   from bgp_connections.
      config:
        ipv4.gateway: "10.11.0.254/24"
        ipv4.ovn.ranges: "10.11.0.10-10.11.0.250"
        dns.nameservers: "10.11.0.254"
        ipv4.routes: "10.12.0.0/24"
        # The session runs between the nodes' core.bgp_address (comp-ew) and the router's comp-ew address, whatever
        # the uplink's own subnet is. iBGP: same ASN as core.bgp_asn and as the Network repo's bgp_connections.
        bgp.peers.router.address: "10.10.0.254"
        bgp.peers.router.asn: "65535"
      description: "Physical uplink to the north-south VLAN (comp-ns), for OVN routers"
    default:
      type: ovn
      config:
        network: UPLINK
        ipv4.address: "10.99.0.1/24"  # Incus-internal NAT'd instance range, not part of the Phorge VLAN plan
        ipv4.nat: "true"
      default: true
      description: "Default OVN network for instances"
  storage:
    remote:
      driver: ceph
      local_config:
        source: "incus_{{ incus_name }}"
      default: true
      description: "Shared Ceph-backed storage pool (cluster-wide)"

# Grafana Alloy (setup-alloy.yml --limit compute): every node monitors itself, see
# the header of playbooks/files/alloy-compute.alloy for what is scraped where and how
# duplicates are avoided. Same layout as the storage group.
alloy_uninstall: false
alloy_version: "1.19.2"
alloy_systemd_override: |
  [Service]
  User=root
  EnvironmentFile=/etc/alloy-secrets.env
alloy_config: "{{ lookup('ansible.builtin.file', 'alloy-compute.alloy') }}"
alloy_ca_cert: "{{ lookup('ansible.builtin.file', 'alloy-ca.crt') }}"

# Each node scrapes its OWN Incus metrics endpoint - the address is the one Incus
# already listens on (core.metrics_address in each host_vars), single source of truth.
alloy_extra_env:
  ALLOY_INCUS_METRICS_ADDRESS: "{{ incus_init_node_config['core.metrics_address'] }}"

# Prometheus and Loki have their own password for this user on core (FrontPlane's
# prometheus-basic-auth-secret and loki-basic-auth-secret, bcrypt cost 12, created
# 2026-09-25 - not shared with "iaas", which is Incus's own native Loki logger).
alloy_basic_auth_username: compute
alloy_prometheus_basic_auth_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          30626264323961343531353565613635363365626661633936373034653861376134626536386231
          3831613436663538636334643831643833333430643162660a313537326463383836326133343938
          61313661393739303934353632386362306639323462326664356363323361373330623265306162
          3132626132323064360a613631353130646136366338396562396239383232613733393335373236
          32393839643932356466663235626235353335323464656333633863386530643038343137646139
          3965656132336165303464303930376339383430376530623161
alloy_loki_basic_auth_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          66656232633761333762353231643031333830383764366662363762353833356463623439343164
          6465383938663261653838323734653163653032643662630a323135306630306437616239323434
          62643133643030646130366163636466356362326533346234396631376133613361303265653461
          3136343135613634390a643963383266653133306630393338363138306537376438636136623635
