---
# Manual patch management, fully interactive (issue #17). The flow:
#   1. heal any dpkg transaction a previous run left half-finished, then check
#      every targeted host for pending updates, free space and the
#      reboot-required flag;
#   2. show ONE plan: the pending packages per host, the CVEs they fix
#      (debsecan), which upgrades touch the kernel or the initramfs, and any
#      host that looks unsafe to patch;
#   3. ask ONE question - "all" (every pending update), "fixes" (only the
#      packages that close a CVE and need no reboot) or "no", which ends the
#      run there without touching anything;
#   4. then, ONE HOST AT A TIME: upgrade it, prove dpkg finished and /boot is
#      still bootable, and - in "all" mode only - ask whether to reboot it and
#      wait for it to come back healthy before moving to the next host. The
#      "fixes" mode never reboots: the run ends with the hosts that need one.
# No service is started, stopped or restarted by the packages being upgraded:
# a policy-rc.d (patch role, apt-detached) refuses it while apt runs and
# records it, a reload is allowed, and the host's held-back restarts are
# listed and restarted only if the maintainer answers yes.
# It sets up no automatic update mechanism of any kind - patching stays a
# manual action run when a maintenance window is planned.
#
#   interactive run:  ansible-playbook playbooks/patch.yml [--limit ...]
#   preview:          ansible-playbook playbooks/patch.yml --check (no prompts)
#
# Three properties make this safe to run against a quorum-based cluster, and
# all three come from svc-rock64-01 bricking itself on 2026-10-03 (see
# docs/explanation/patch-management-design.md for the post-mortem):
#   - the upgrade runs as a transient systemd unit, not as a child of the SSH
#     session, so losing the connection or pressing Ctrl-C can no longer stop
#     dpkg half-way (patch role, apt-detached);
#   - /boot is proven consistent before a reboot is even offered
#     (the patch role, check-boot-consistency entry point);
#   - serial: 1 with any_errors_fatal means one host is patched, rebooted and
#     back in service before the next is touched, and the first failure stops
#     the rollout instead of marching through the rest of the cluster.

- name: Heal, then survey every targeted host
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Heal this host, then collect what the plan needs
      ansible.builtin.include_role:
        name: patch
        tasks_from: survey

- name: Propose the plan and wait for one decision
  hosts: all
  gather_facts: false
  # run_once and the single prompt only make sense in run order, so the
  # strategy is pinned rather than inherited.
  strategy: linear
  tasks:
    # ansible_play_hosts, not ansible_play_hosts_all: a host that went
    # unreachable during the survey surveyed nothing, so it has no plan entry
    # and must not be looped over, counted as patchable, or used to read the
    # answer back. _all still contains it.
    - name: Report the hosts that dropped out before the plan  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: >-
          NOT PATCHED, unreachable during the survey:
          {{ ansible_play_hosts_all | difference(ansible_play_hosts) | join(', ') }}
      run_once: true
      when: ansible_play_hosts_all | difference(ansible_play_hosts) | length > 0

    - name: Show the plan host by host  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: "{{ hostvars[item].patch_plan_entry }}"
      loop: "{{ ansible_play_hosts }}"
      run_once: true
      loop_control:
        label: "{{ item }}"

    - name: Ask once what to apply  # noqa: run-once[task]
      ansible.builtin.pause:
        prompt: |-
          {{ ansible_play_hosts | length }} host(s) to patch, one at a time.
          Lines marked !! above are the ones worth reading twice.
          What to apply?
            all    every pending update, and a question before each reboot
            fixes  only the packages that close a CVE and need no reboot;
                   never reboots, and lists the hosts that need one at the end
            no     nothing
          No service is restarted without a further answer of yours.
          [all/fixes/no]
      register: patch_decision
      run_once: true
      when: not ansible_check_mode

    - name: Remember the decision on every host
      ansible.builtin.set_fact:
        patch_answer: "{{ hostvars[ansible_play_hosts[0]].patch_decision.user_input | default('') | trim | lower }}"

    - name: Turn the answer into a mode
      ansible.builtin.set_fact:
        patch_mode: "{{ 'all' if patch_answer in ['all', 'a', 'yes', 'y', 'oui'] else ('fixes' if patch_answer in ['fixes', 'fix', 'f'] else 'none') }}"

    - name: Remember whether anything is to be applied
      ansible.builtin.set_fact:
        patch_apply: "{{ patch_mode != 'none' }}"

    - name: Stop the run when the plan is refused
      ansible.builtin.meta: end_host
      when: not ansible_check_mode and not (patch_apply | bool)

# One host at a time, and the first failure stops the rollout: on a 3-node
# etcd cluster this is what keeps a bad upgrade from taking the quorum with it.
# Each host is upgraded, proven consistent, rebooted if asked and back in
# service before the next one is touched.
- name: Patch each host in turn, and prove it is still bootable
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    # safe = apt-get upgrade (no removals, no brand-new packages), the
    # conservative default consistent with manual patching; pass
    # -e patch_upgrade=dist for dist-upgrade when new dependencies are wanted.
    patch_upgrade: safe
  tasks:
    - name: Upgrade the packages, detached from this SSH session
      ansible.builtin.include_role:
        name: patch
        tasks_from: apt-detached
      vars:
        patch_detached_name: upgrade
        # --force-confold keeps a modified config file instead of prompting:
        # the unit has no terminal to prompt on.
        patch_detached_command: >-
          apt-get -y
          -o Dpkg::Options::=--force-confdef
          -o Dpkg::Options::=--force-confold
          {{ 'dist-upgrade' if patch_upgrade == 'dist' else 'upgrade' }}
        patch_detached_timeout: 5400
      when: not ansible_check_mode and (patch_mode | default('none')) == 'all'

    # Targeted mode: simulate first, because apt may drag in more than the
    # named packages. A host whose simulation would pull a kernel, a bootloader
    # or a package another playbook owns is skipped and reported, not failed:
    # the rest of the rollout is not blocked by one host that needs a window.
    - name: Simulate the targeted upgrade
      ansible.builtin.include_role:
        name: patch
        tasks_from: fix-simulate
      when: >-
        (ansible_check_mode or (patch_mode | default('none')) == 'fixes')
        and patch_fix_targets | length > 0

    - name: Say why this host is skipped in fixes mode
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: fixes mode skips this host, {{ patch_fix_problem }}"
      when: >-
        (patch_mode | default('none')) == 'fixes'
        and patch_fix_targets | length > 0
        and not (patch_fix_go | default(false) | bool)

    - name: Upgrade only the packages that close a CVE, detached from this SSH session
      ansible.builtin.include_role:
        name: patch
        tasks_from: apt-detached
      vars:
        patch_detached_name: fixes
        patch_detached_command: >-
          apt-get -y
          -o Dpkg::Options::=--force-confdef
          -o Dpkg::Options::=--force-confold
          install --only-upgrade
          {{ patch_fix_targets | map('quote') | join(' ') }}
        patch_detached_timeout: 5400
      when: >-
        not ansible_check_mode and (patch_mode | default('none')) == 'fixes'
        and patch_fix_targets | length > 0 and (patch_fix_go | default(false) | bool)

    - name: Remember whether an upgrade ran on this host
      ansible.builtin.set_fact:
        patch_upgrade_ran: >-
          {{ not ansible_check_mode and (
               (patch_mode | default('none')) == 'all'
               or ((patch_mode | default('none')) == 'fixes'
                   and patch_fix_targets | length > 0
                   and (patch_fix_go | default(false) | bool))) }}

    - name: Describe what the fixes mode would do
      ansible.builtin.set_fact:
        patch_fix_extra_text: "{{ ' (and, as dependencies, ' ~ (patch_fix_extra | join(', ')) ~ ')' if patch_fix_extra | default([]) | length > 0 else '' }}"
        patch_fix_skip_text: "{{ ' - SKIPPED, ' ~ patch_fix_problem if (patch_fix_go is defined and not patch_fix_go) else '' }}"
        patch_fix_left: "{{ patch_fix_deferred + patch_fix_handover }}"
      when: ansible_check_mode

    - name: Report what would be upgraded
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: would upgrade
          {{ patch_pending.stdout_lines | length }} package(s)
          {{ ('(of which ' ~ (patch_boot_packages | join(', ')) ~ ' rewrite /boot)') if patch_boot_packages | length > 0 else '' }}.
          Fixes mode would upgrade {{ patch_fix_targets | length }} package(s) now
          ({{ patch_fix_targets | join(', ') }}){{ patch_fix_extra_text }}{{ patch_fix_skip_text }}
          and leave {{ patch_fix_left | length }} for a reboot window ({{ patch_fix_left | join(', ') }})
      when: ansible_check_mode

    - name: Fail when the upgrade did not finish cleanly
      ansible.builtin.assert:
        that: patch_detached.rc == 0
        fail_msg: >-
          {{ inventory_hostname }}: apt exited {{ patch_detached.rc }}.
          {{ 'The upgrade is STILL RUNNING under systemd and was left alone on
          purpose - re-run this playbook to pick it up where it stopped.'
             if patch_detached.rc == 124
             else 'See /var/log/phorge-patch-upgrade.log on the host.' }}
          Last output: {{ patch_detached.stdout_lines | default([]) | join(' | ') }}
        quiet: true
      when: patch_upgrade_ran | default(false) | bool

    - name: Check that dpkg finished every package
      ansible.builtin.shell: |
        set -o pipefail
        dpkg-query -W -f '${Status}\t${Package}\n' 2>/dev/null \
          | awk -F'\t' '$1 ~ /(half-configured|half-installed|unpacked|triggers-pending|triggers-awaited)/ {print $2}'
      args:
        executable: /bin/bash
      register: patch_broken_post
      changed_when: false
      check_mode: false
      when: not ansible_check_mode and (patch_apply | default(false) | bool)

    - name: Fail when dpkg left a package unconfigured
      ansible.builtin.assert:
        that: patch_broken_post.stdout_lines | length == 0
        fail_msg: >-
          {{ inventory_hostname }}: {{ patch_broken_post.stdout_lines | length }}
          package(s) unconfigured after the upgrade
          ({{ patch_broken_post.stdout_lines[:8] | join(', ') }}). NOT rebooting
          this host - it still runs the loaded kernel, which is the safe state.
        quiet: true
      when: not ansible_check_mode and (patch_apply | default(false) | bool)

    - name: Check that /boot can still boot
      ansible.builtin.include_role:
        name: patch
        tasks_from: check-boot-consistency
      when: not ansible_check_mode and (patch_apply | default(false) | bool)

    # The gate. A host whose /boot is inconsistent is still perfectly alive on
    # its already-loaded kernel; rebooting it is what turns that into a brick,
    # so the run stops here and the reboot is never offered.
    - name: Refuse to reboot a host whose /boot is inconsistent
      ansible.builtin.assert:
        that: patch_boot_problems | length == 0
        fail_msg: >-
          {{ inventory_hostname }}: /boot is NOT consistent, so this host must
          not be rebooted - it keeps running fine on the kernel already loaded.
          Found: {{ patch_boot_problems | join(' ; ') }}.
          Fix /boot (usually `dpkg --configure -a` then
          `update-initramfs -c -k <version>`) and verify before any reboot.
        quiet: true
      when: not ansible_check_mode and (patch_apply | default(false) | bool)

    # The packages were not allowed to restart anything. Which services asked
    # is listed, and nothing is restarted before the maintainer says yes: a
    # restart can interrupt production (Incus, Ceph, NFS, the k0s workloads).
    - name: Read the service restarts that were held back
      ansible.builtin.include_role:
        name: patch
        tasks_from: held-restarts
      vars:
        patch_held_name: "{{ 'fixes' if (patch_mode | default('none')) == 'fixes' else 'upgrade' }}"
      when: patch_upgrade_ran | default(false) | bool

    - name: Ask whether to restart the held-back services
      ansible.builtin.pause:
        prompt: |-
          {{ inventory_hostname }}: the upgrade asked to restart these services and was not allowed to:
            {{ patch_held_services | join(', ') }}
          They keep running the code they had before the upgrade (or are not running).
          Restart them now, one at a time? [yes/no]
      register: patch_restart_answer
      when: >-
        not ansible_check_mode and (patch_upgrade_ran | default(false) | bool)
        and patch_held_services | length > 0

    - name: Restart the held-back services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ patch_held_services }}"
      when: >-
        not ansible_check_mode and (patch_upgrade_ran | default(false) | bool)
        and patch_held_services | length > 0
        and (patch_restart_answer.user_input | default('') | trim | lower) in ['yes', 'y', 'oui']

    - name: Record the services still running their old code
      ansible.builtin.set_fact:
        patch_restart_pending: >-
          {{ (patch_held_services | default([]))
             if ((patch_upgrade_ran | default(false) | bool)
                 and (patch_restart_answer.user_input | default('') | trim | lower) not in ['yes', 'y', 'oui'])
             else [] }}

    - name: List what is still upgradable after the upgrade
      ansible.builtin.shell: |
        set -o pipefail
        apt list --upgradable 2>/dev/null | awk '$1 ~ /\// {split($1, a, "/"); print a[1], $2}'
      args:
        executable: /bin/bash
      register: patch_pending_after
      changed_when: false
      check_mode: false

    # Held or phased updates legitimately stay upgradable after the run; they
    # are reported as such instead of failing the play.
    - name: Record the packages changed by this run
      ansible.builtin.set_fact:
        patch_applied_list: "{{ patch_pending.stdout_lines | difference(patch_pending_after.stdout_lines) }}"

    - name: Check the reboot-required flag
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: patch_reboot_required

    - name: Ask whether to reboot this host
      ansible.builtin.pause:
        prompt: |-
          {{ inventory_hostname }} is flagged reboot-required.
          /boot checked consistent, dpkg clean, {{ patch_applied_list | length }} package(s) upgraded.
          Reboot it now? [yes/no]
      register: patch_reboot_answer
      when: >-
        not ansible_check_mode and (patch_mode | default('none')) == 'all'
        and patch_reboot_required.stat.exists

    - name: Reboot this host
      ansible.builtin.reboot:
        reboot_timeout: 900
      register: patch_rebooted
      when: >-
        not ansible_check_mode
        and (patch_mode | default('none')) == 'all'
        and patch_reboot_required.stat.exists
        and (patch_reboot_answer.user_input | default('') | trim | lower) in ['yes', 'y', 'oui']

    # Coming back on the network is not the same as coming back healthy, and a
    # host that boots degraded must stop the rollout before the next node is
    # touched.
    - name: Check that the host came back healthy
      ansible.builtin.shell: |
        set -uo pipefail
        echo "state=$(systemctl is-system-running 2>/dev/null)"
        echo "kernel=$(uname -r)"
        systemctl list-units --state=failed --no-legend --plain 2>/dev/null | awk '{print "failed: "$1}'
      args:
        executable: /bin/bash
      register: patch_post_boot
      changed_when: false
      check_mode: false
      when: patch_rebooted.rebooted | default(false) | bool

    - name: Check that /boot is still consistent after the reboot
      ansible.builtin.include_role:
        name: patch
        tasks_from: check-boot-consistency
      when: patch_rebooted.rebooted | default(false) | bool

    - name: Fail when the host came back with failed units or a broken /boot
      ansible.builtin.assert:
        that:
          - patch_boot_problems | length == 0
          - patch_post_boot.stdout is search('state=(running|starting)')
        fail_msg: >-
          {{ inventory_hostname }} rebooted but did not come back clean -
          stopping before the next host. {{ patch_post_boot.stdout_lines | join(' | ') }}
          {{ ('/boot: ' ~ (patch_boot_problems | join(' ; '))) if patch_boot_problems | length > 0 else '' }}
        quiet: true
      when: patch_rebooted.rebooted | default(false) | bool

    # What a reboot would still change on this host, read after the run (and
    # after the reboot, when there was one). The final summary lists it: the
    # "fixes" mode never reboots, so this is how the maintainer is told.
    - name: Read the kernel state after the run
      ansible.builtin.include_role:
        name: patch
        tasks_from: kernel-state

    - name: Record why this host needs a reboot
      ansible.builtin.set_fact:
        patch_reboot_reasons: >-
          {{ (['the reboot-required flag is set'] if (patch_reboot_required.stat.exists and not (patch_rebooted.rebooted | default(false) | bool)) else [])
             + (['running kernel ' ~ patch_kernel_running ~ ', ' ~ patch_kernel_newest ~ ' is installed']
                if patch_kernel_running != patch_kernel_newest else [])
             + (['fix(es) left for a reboot window: ' ~ (patch_fix_deferred | join(', '))]
                if ((patch_mode | default('none')) == 'fixes' and patch_fix_deferred | length > 0) else []) }}
      when: not ansible_check_mode and (patch_apply | default(false) | bool)

    - name: Build this host's summary line
      ansible.builtin.set_fact:
        patch_summary_line: >-
          {{ inventory_hostname }}: {{ patch_applied_list | length }} upgraded,
          {{ patch_pending_after.stdout_lines | length }} still pending,
          reboot required: {{ patch_reboot_required.stat.exists }},
          rebooted: {{ (patch_rebooted.rebooted | default(false)) | bool }},
          mode: {{ patch_mode | default('none') }}
          {{ ('(now on ' ~ (patch_post_boot.stdout
                | regex_search('kernel=(\S+)', '\\1') | first) ~ ')')
             if patch_rebooted.rebooted | default(false) | bool else '' }}
          {{ '(check mode - nothing applied)' if ansible_check_mode else '' }}

- name: Summarize the run
  hosts: all
  gather_facts: false
  # run_once and the single prompt only make sense in run order, so the
  # strategy is pinned rather than inherited.
  strategy: linear
  tasks:
    - name: Print the per-host summary  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: "{{ hostvars | dict2items | selectattr('value.patch_summary_line', 'defined') | map(attribute='value.patch_summary_line') | list }}"
      run_once: true

    # The "fixes" mode never reboots, and "all" leaves a host as it is when the
    # reboot is declined: this is the notification that a reboot is still due.
    - name: Tell which hosts still need a reboot  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: "REBOOT NEEDED on {{ item.key }} (not rebooted): {{ item.value.patch_reboot_reasons | join(' ; ') }}"
      loop: >-
        {{ hostvars | dict2items | selectattr('value.patch_reboot_reasons', 'defined')
           | rejectattr('value.patch_reboot_reasons', 'equalto', []) | list }}
      loop_control:
        label: "{{ item.key }}"
      run_once: true

    - name: Tell which hosts still have services on their old code  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: "RESTART NEEDED on {{ item.key }} (not restarted, still on the old code): {{ item.value.patch_restart_pending | join(', ') }}"
      loop: >-
        {{ hostvars | dict2items | selectattr('value.patch_restart_pending', 'defined')
           | rejectattr('value.patch_restart_pending', 'equalto', []) | list }}
      loop_control:
        label: "{{ item.key }}"
      run_once: true

    - name: Say that nothing is left to reboot or restart  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: No host needs a reboot or a service restart.
      run_once: true
      when: >-
        not ansible_check_mode
        and (hostvars | dict2items | selectattr('value.patch_reboot_reasons', 'defined')
             | rejectattr('value.patch_reboot_reasons', 'equalto', []) | list | length) == 0
        and (hostvars | dict2items | selectattr('value.patch_restart_pending', 'defined')
             | rejectattr('value.patch_restart_pending', 'equalto', []) | list | length) == 0
        and (hostvars | dict2items | selectattr('value.patch_reboot_reasons', 'defined') | list | length) > 0
