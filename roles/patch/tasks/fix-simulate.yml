---
# Simulate the targeted upgrade before it runs. `--only-upgrade` upgrades the
# named packages, but apt may also upgrade or install what they depend on; if
# that drags in a kernel, a bootloader or a package another playbook owns, the
# targeted mode would no longer be "no reboot", so the host is skipped instead.
# Read-only (`apt-get -s`), so it also runs under --check.
#
# Input:   patch_fix_targets    packages to upgrade
# Output:  patch_fix_go         true when the upgrade may run
#          patch_fix_extra      packages apt would upgrade besides the targets
#          patch_fix_problem    why the host is skipped, empty when it is not
- name: Simulate the targeted upgrade
  ansible.builtin.shell: |
    set -o pipefail
    LC_ALL=C apt-get -s -o Dpkg::Options::=--force-confold install --only-upgrade \
      {{ patch_fix_targets | map('quote') | join(' ') }} 2>&1 | awk '/^Inst /{print $2}'
  args:
    executable: /bin/bash
  register: patch_fix_simulation
  changed_when: false
  failed_when: false
  check_mode: false

- name: Work out what the targeted upgrade would drag along
  ansible.builtin.set_fact:
    patch_fix_extra: "{{ patch_fix_simulation.stdout_lines | difference(patch_fix_targets) }}"

- name: Pick out the extra packages that would need a reboot or belong to another playbook
  ansible.builtin.set_fact:
    patch_fix_extra_boot: "{{ patch_fix_extra | select('match', patch_boot_packages_regex) | list }}"
    patch_fix_extra_handover: >-
      {{ (patch_fix_extra | select('match', patch_handover_regex) | list)
         if (patch_handover_regex | length > 0) else [] }}

- name: Decide whether the targeted upgrade may run
  ansible.builtin.set_fact:
    patch_fix_problem: >-
      {{ ('apt could not simulate the upgrade (exit ' ~ patch_fix_simulation.rc ~ ')')
         if patch_fix_simulation.rc != 0 else
         ('it would also upgrade ' ~ (patch_fix_extra_boot | join(', ')) ~ ', which needs a reboot')
         if patch_fix_extra_boot | length > 0 else
         ('it would also upgrade ' ~ (patch_fix_extra_handover | join(', ')) ~ ', owned by ' ~ patch_handover_playbook)
         if patch_fix_extra_handover | length > 0 else '' }}

- name: Record whether the targeted upgrade may run
  ansible.builtin.set_fact:
    patch_fix_go: "{{ patch_fix_problem | length == 0 }}"
