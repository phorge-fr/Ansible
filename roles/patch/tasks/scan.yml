---
# Scan one host with debsecan and turn the result into the vulnerability lines
# of its plan entry. Read-only: debsecan only reads the package database and
# downloads the Debian security tracker data, it changes no package.
#
# Included by survey.yml once the pending packages are known, because a CVE is
# only "fixable now" when the package carrying the fix is in that list.
#
# Output:
#   patch_scan_lines     the lines appended to the host's plan entry
#   patch_fix_targets    pending packages with a fix that need no reboot
#   patch_fix_deferred   pending packages with a fix that rewrite /boot (need a reboot)
#   patch_fix_handover   pending packages with a fix that another playbook owns
#   patch_kernel_running, patch_kernel_newest   see kernel-state.yml

- name: Look for debsecan
  ansible.builtin.shell: command -v debsecan
  args:
    executable: /bin/bash
  register: patch_debsecan
  changed_when: false
  failed_when: false
  check_mode: false

# debsecan only knows suites up to bullseye by name, so the suite is passed
# explicitly.
- name: Read the Debian release
  ansible.builtin.shell: . /etc/os-release && printf '%s' "$VERSION_CODENAME"
  args:
    executable: /bin/bash
  register: patch_scan_env
  changed_when: false
  check_mode: false

- name: Record the Debian release
  ansible.builtin.set_fact:
    patch_scan_suite: "{{ patch_scan_env.stdout }}"

- name: Read the kernel state
  ansible.builtin.include_tasks: kernel-state.yml

# One line per package: name|CVE count|remotely exploitable|high urgency|first
# CVE ids. A failure is reported as "ERROR|reason" rather than as an empty
# list, which would read as "nothing to fix".
- name: Run debsecan on the fixed vulnerabilities
  ansible.builtin.shell: |
    set -o pipefail
    out=$(LC_ALL=C debsecan --suite {{ patch_scan_suite }} --only-fixed 2>&1) \
      || { echo "ERROR|$(printf '%s' "$out" | head -n 1)"; exit 0; }
    printf '%s\n' "$out" | awk '
      $1 ~ /^(CVE|TEMP)-/ {
        n[$2]++
        if ($0 ~ /remotely exploitable/) r[$2] = 1
        if ($0 ~ /high urgency/) h[$2] = 1
        if (n[$2] <= 3) c[$2] = (c[$2] == "" ? $1 : c[$2] ", " $1)
      }
      END { for (p in n) printf "%s|%d|%d|%d|%s\n", p, n[p], r[p] + 0, h[p] + 0, c[p] }
    ' | sort
  args:
    executable: /bin/bash
  register: patch_scan
  changed_when: false
  check_mode: false
  when: patch_debsecan.rc == 0

# A fix is applied without a reboot when its package is pending and is not one
# of the kernel, firmware and bootloader packages (the ones that rewrite /boot,
# see patch_boot_packages_regex) or of the packages another playbook owns.
# Those are kept apart and reported, never upgraded by the targeted mode.
- name: Find the pending packages that carry a fix
  ansible.builtin.set_fact:
    patch_fix_candidates: >-
      {{ (patch_scan.stdout_lines | map('split', '|') | map('first') | list
          | intersect(patch_pending.stdout_lines | map('split', ' ') | map('first') | list))
         if (patch_debsecan.rc == 0 and not patch_scan.stdout.startswith('ERROR|')) else [] }}

- name: Split the fixes into those that need a reboot and those that do not
  ansible.builtin.set_fact:
    patch_fix_deferred: "{{ patch_fix_candidates | select('match', patch_boot_packages_regex) | list }}"
    patch_fix_handover: >-
      {{ (patch_fix_candidates | select('match', patch_handover_regex) | list)
         if (patch_handover_regex | length > 0) else [] }}

- name: Keep the fixes the targeted mode may apply
  ansible.builtin.set_fact:
    patch_fix_targets: "{{ patch_fix_candidates | difference(patch_fix_deferred) | difference(patch_fix_handover) }}"

- name: Build the vulnerability lines of the plan entry
  ansible.builtin.set_fact:
    patch_scan_lines: "{{ lookup('ansible.builtin.template', 'scan-lines.j2').splitlines() }}"
