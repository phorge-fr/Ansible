---
- name: Refuse to disable password authentication while Ansible connects with a password
  ansible.builtin.assert:
    that:
      - ansible_password is not defined
      - ansible_ssh_pass is not defined
    fail_msg: >-
      Ansible connects to {{ inventory_hostname }} with a password, disabling password
      authentication would lock it out. Set up key-based access first.
    quiet: true
  when: not ssh_hardening_password_authentication

- name: Ensure sshd reads the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Create the sshd drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the hardening drop-in
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-phorge-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Apply the sshd configuration now
  ansible.builtin.meta: flush_handlers

- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_hardening_effective
  changed_when: false
  check_mode: false

- name: Verify the effective sshd configuration
  vars:
    ssh_hardening_accepted_root_login:
      - "permitrootlogin {{ ssh_hardening_permit_root_login }}"
      - "permitrootlogin {{ 'without-password' if ssh_hardening_permit_root_login == 'prohibit-password' else ssh_hardening_permit_root_login }}"
  ansible.builtin.assert:
    that:
      - ssh_hardening_effective.stdout_lines | intersect(ssh_hardening_accepted_root_login) | length == 1
      - ('passwordauthentication ' ~ ('yes' if ssh_hardening_password_authentication else 'no')) in ssh_hardening_effective.stdout_lines
    fail_msg: >-
      The effective sshd configuration of {{ inventory_hostname }} does not match the baseline,
      another directive read before the drop-in wins (first value wins in sshd_config).
    quiet: true
  when: not ansible_check_mode

- name: Read the effective sshd configuration for the password login exceptions
  ansible.builtin.command: >-
    /usr/sbin/sshd -T -C user={{ item }},host=localhost,addr={{ (ssh_hardening_password_login_sources | first | default('127.0.0.1')).split('/')[0] }}
  loop: "{{ ssh_hardening_password_login_users }}"
  register: ssh_hardening_exceptions
  changed_when: false
  when: not ansible_check_mode

- name: Verify that the password login exceptions are effective
  ansible.builtin.assert:
    that: "'passwordauthentication yes' in item.stdout_lines"
    fail_msg: >-
      {{ item.item }} cannot log in with a password on {{ inventory_hostname }}
      from {{ ssh_hardening_password_login_sources | join(', ') }}.
    quiet: true
  loop: "{{ ssh_hardening_exceptions.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode
